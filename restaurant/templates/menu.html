{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu | Little Lemon</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <header>
    <h1>Little Lemon</h1>
    <nav>
      <a href="{% url 'home' %}">Home</a>
      <a href="{% url 'menu-page' %}">Menu</a>
    </nav>
  </header>
  <main>
    <h2>Our Menu</h2>
    {% if menu %}
    <table>
      <thead><tr><th>Dish</th><th>Price</th><th>In stock</th></tr></thead>
      <tbody>
      {% for item in menu %}
        <tr><td>{{ item.title }}</td><td>${{ item.price }}</td><td>{{ item.inventory }}</td></tr>
      {% endfor %}
      </tbody>
    </table>
    {% else %}
      <p>The menu is being updated. Please check back soon.</p>
    {% endif %}
  </main>
  <footer><p>&copy; Little Lemon Restaurant</p></footer>
</body>
</html>
